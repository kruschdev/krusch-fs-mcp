name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout krusch-fs-mcp
        uses: actions/checkout@v4

      - name: Checkout krusch-nexus (Library Mode dependency)
        uses: actions/checkout@v4
        with:
          repository: kruschdev/krusch-nexus
          path: _deps/krusch-nexus

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e _deps/krusch-nexus
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: |
          pytest tests/ -v
