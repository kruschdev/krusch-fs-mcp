[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-fs"
version = "0.3.1"
description = "Standalone Opt-In OS Filesystem & KruschNexus Page-Anchored Memory MCP Server"
readme = "README.md"
authors = [{ name = "kruschdev", email = "kruschdev@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.25",
    "mcp>=1.0.0",
    "krusch-nexus>=0.2.5",
]

[project.optional-dependencies]
krusch_nexus = [
    "krusch-nexus>=0.2.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
krusch-fs = "krusch_fs.cli:main"
krusch-fs-mcp = "krusch_fs.mcp:main"
pg-fs-mcp = "krusch_fs.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["krusch_fs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
